name: Build CZATeria Plus Mobile 9.9 APK

on:
  push:
    branches: [czateria-plus-mobile-99]
    paths:
      - 'mobile99/**'
      - '.github/workflows/build-mobile99.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile99
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/CZATeria-Plus-Mobile-0.6.3-XBookmark-9.9.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CZATeria-Plus-Mobile-0.6.3-XBookmark-9.9
          path: mobile99/app/build/outputs/apk/debug/CZATeria-Plus-Mobile-0.6.3-XBookmark-9.9.apk
          if-no-files-found: error
      - name: Publish temporary dist APK
        working-directory: .
        run: |
          mkdir -p dist
          cp mobile99/app/build/outputs/apk/debug/CZATeria-Plus-Mobile-0.6.3-XBookmark-9.9.apk dist/Czateria_PLUS_Android_v0.6.3.apk
          echo "2437fab6cff48bd9d2f0928e80cd734047ae9bbc2a6efcef69585c56eddd27a0  dist/Czateria_PLUS_Android_v0.6.3.apk" | sha256sum -c -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/Czateria_PLUS_Android_v0.6.3.apk
          git diff --cached --quiet || git commit -m "Temporary APK transfer for Czateria_PLUS_Android v0.6.3"
          git push origin HEAD:czateria-plus-mobile-99
